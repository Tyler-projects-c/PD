# PD web pixel extension (new unified extension config format).
# Reference: https://shopify.dev/docs/apps/build/extensions/extension-configs
api_version = "2026-01"

type = "web_pixel_extension"
name = "pd-web-pixel"
handle = "pd-web-pixel"
description = "PD product discovery tracking pixel: captures storefront customer events and posts them to the app's ingestion endpoint"
runtime_context = "strict"
uid = "8b86b8f8-c3b3-37f5-275e-ea255cf81b41fa8488ab"

[customer_privacy]
# PD is an internal analytics/experimentation pixel only (per shopify.dev/docs/api/customer-privacy:
# analytics = "customer analytics about how the storefront was used and interactions
# made on the storefront"). No marketing retargeting, no data sale/sharing.
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.apiUrl]
name = "API URL"
description = "Full URL of the PD event ingestion endpoint that receives storefront customer events"
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]
